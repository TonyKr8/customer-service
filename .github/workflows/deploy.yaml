name: Deploy to OpenShift

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Install OpenShift CLI (oc)
      uses: redhat-actions/oc-installer@v1
      with:
        oc_version: 'latest'

    - name: Log in to OpenShift
      uses: redhat-actions/oc-login@v1
      with:
        openshift_server_url: ${{ secrets.OCP_SERVER }}
        openshift_token: ${{ secrets.OCP_TOKEN }}
        namespace: ${{ secrets.OCP_NAMESPACE }}

    - name: Create or Update OpenShift Application
      run: |
        # בדיקה האם האפליקציה (BuildConfig) כבר קיימת בתוך ה-Namespace
        if ! oc get bc/customer-service 2>/dev/null; then
          echo "Creating new app from Dockerfile build..."
          # יצירת האפליקציה עם הגדרת פורט המטרה הנכון עבור OpenShift
          oc new-app . --name=customer-service --strategy=docker --target-port=8080
          # חשיפת הסרוויס החוצה לאינטרנט לקבלת כתובת URL
          oc expose svc/customer-service
        else
          echo "App exists, ensuring ports are correct and triggering new build..."
          # פקודת תיקון: מעדכנת ומיישרת בכוח את ה-Service הקיים לעבוד מול פורט 8080
          oc patch svc/customer-service -p '{"spec":{"ports":[{"port":8080,"targetPort":8080}]}}'
          # הרצת ה-Build מחדש עם הקוד העדכני
          oc start-build customer-service --from-dir=. --follow
        fi