- name: Create or Update OpenShift Application
      run: |
        # בדיקה האם האפליקציה (BuildConfig) כבר קיימת בתוך ה-Namespace
        if ! oc get bc/customer-service 2>/dev/null; then
          echo "Creating new app from Dockerfile build..."
          oc new-app . --name=customer-service --strategy=docker --target-port=8080
          oc expose svc/customer-service
        else
          echo "App exists. Cleaning up old network layout to ensure port 8080 is used..."
          
          # מחיקה לטובת סנכרון
          oc delete svc/customer-service --ignore-not-found=true
          oc delete route/customer-service --ignore-not-found=true
          
          # יצירה מחדש וחשיפה
          oc create service clusterip customer-service --tcp=8080:8080
          oc expose svc/customer-service
          
          echo "Triggering new build..."
          oc start-build customer-service --from-dir=. --follow
        fi

        echo "------------------------------------------------------"
        echo "YOUR APPLICATION URL IS:"
        oc get route customer-service -o jsonpath='{.spec.host}'
        echo ""
        echo "------------------------------------------------------"