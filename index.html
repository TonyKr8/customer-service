<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Support Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                        accentNeon: '#10b981',
                        accentBlue: '#3b82f6'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('[https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap](https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap)');
        body { font-family: 'Rubik', sans-serif; }
    </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-cardBg/50 backdrop-blur p-4 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-accentNeon animate-pulse"></div>
                <h1 class="text-xl font-bold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-blue-500">Support.io</h1>
            </div>
            <span class="text-xs bg-slate-800 px-3 py-1 rounded-full border border-slate-700 text-slate-400">מחובר כמנהל מערכת</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto p-6 w-full flex-grow grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Quick Stats & Actions -->
        <div class="md:col-span-1 flex flex-col gap-6">
            <div class="bg-cardBg p-6 rounded-2xl border border-slate-800 shadow-xl">
                <h3 class="text-lg font-medium mb-4 text-slate-400">סטטוס מוקד</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-darkBg p-4 rounded-xl border border-slate-800">
                        <p class="text-sm text-slate-400">פניות פתוחות</p>
                        <p class="text-2xl font-bold text-accentBlue">12</p>
                    </div>
                    <div class="bg-darkBg p-4 rounded-xl border border-slate-800">
                        <p class="text-sm text-slate-400">זמן תגובה ממוצע</p>
                        <p class="text-2xl font-bold text-accentNeon">4 דק׳</p>
                    </div>
                </div>
            </div>

            <!-- Quick Ticket Form -->
            <div class="bg-cardBg p-6 rounded-2xl border border-slate-800 shadow-xl">
                <h3 class="text-lg font-medium mb-4 text-slate-300">פתיחת קריאה מהירה</h3>
                <form id="ticketForm" class="flex flex-col gap-3" onsubmit="createTicket(event)">
                    <input type="text" id="userEmail" placeholder="אימייל לקוח" required class="bg-darkBg border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-accentBlue transition">
                    <textarea id="ticketMsg" placeholder="מה הבעיה?" rows="3" required class="bg-darkBg border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-accentBlue transition"></textarea>
                    <button type="submit" class="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-medium p-3 rounded-xl transition text-sm shadow-lg shadow-emerald-900/20">שגר פנייה</button>
                </form>
            </div>
        </div>

        <!-- Support Queue / Live Chat Simulation -->
        <div class="md:col-span-2 bg-cardBg rounded-2xl border border-slate-800 shadow-xl flex flex-col h-[500px]">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/50 rounded-t-2xl">
                <div>
                    <h3 class="font-medium text-slate-200">צ'אט תמיכה פעיל</h3>
                    <p class="text-xs text-slate-400">מערכת סימולציה מבוססת UI</p>
                </div>
                <span class="px-2 py-1 bg-emerald-500/10 text-emerald-400 text-xs rounded border border-emerald-500/20">Live</span>
            </div>

            <!-- Chat Messages Area -->
            <div id="chatArea" class="p-4 flex-grow overflow-y-auto flex flex-col gap-3 space-y-reverse">
                <div class="bg-darkBg p-3 rounded-2xl rounded-br-none max-w-md self-end border border-slate-800">
                    <p class="text-xs text-slate-400 mb-1">נציג תמיכה (רובוט)</p>
                    <p class="text-sm">שלום! ברוכים הבאים לפורטל השירות המרענן שלנו. איך אפשר לעזור לכם היום?</p>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center p-4 border-t border-slate-800 text-xs text-slate-500">
        © 2026 Support.io - פלטפורמת שירות לקוחות בענן
    </footer>

    <!-- Logic Script -->
    <script>
        function createTicket(event) {
            event.preventDefault();
            const email = document.getElementById('userEmail').value;
            const msg = document.getElementById('ticketMsg').value;
            const chatArea = document.getElementById('chatArea');

            // הוספת הודעת המשתמש לצ'אט
            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'bg-accentBlue/10 p-3 rounded-2xl rounded-bl-none max-w-md self-start border border-accentBlue/20 text-right';
            userMsgDiv.innerHTML = `<p class="text-xs text-accentBlue mb-1">${email}</p><p class="text-sm text-slate-200">${msg}</p>`;
            chatArea.appendChild(userMsgDiv);

            // איפוס טופס
            document.getElementById('ticketForm').reset();
            chatArea.scrollTop = chatArea.scrollHeight;

            // תגובה אוטומטית כעבור שנייה
            setTimeout(() => {
                const systemMsgDiv = document.createElement('div');
                systemMsgDiv.className = 'bg-darkBg p-3 rounded-2xl rounded-br-none max-w-md self-end border border-slate-800';
                systemMsgDiv.innerHTML = `<p class="text-xs text-slate-400 mb-1">מערכת אוטומטית</p><p class="text-sm">הקריאה התקבלה בהצלחה! מספר פנייה: #${Math.floor(Math.random() * 9000) + 1000}</p>`;
                chatArea.appendChild(systemMsgDiv);
                chatArea.scrollTop = chatArea.scrollHeight;
            }, 1000);
        }
    </script>
</body>
</html>
